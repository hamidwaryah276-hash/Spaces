<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Spaces">
<link rel="apple-touch-icon" id="appIcon" href="">
<title>Spaces</title>
<style>
:root{--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8;--line:#262626;--card:#1c1c1e;--btn:#363636;--blue:#0095f6;--red:#ff3040;--tab:50px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--cols:5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden}
.view{position:absolute;left:0;right:0;top:0;bottom:calc(var(--tab) + var(--sb));display:none;background:#000}
.view.on{display:block}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);display:flex;align-items:center;background:#000;border-top:1px solid var(--line);z-index:30}
.tabbar button{flex:1;height:var(--tab);display:grid;place-items:center;color:#fff}
.tabbar svg{width:27px;height:27px}
.tabbar .me .av{width:28px;height:28px;font-size:12px}
.tabbar .me.on .av{outline:2px solid #fff;outline-offset:1px}

/* reels feed */
.feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.slide .bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(36px) brightness(.4) saturate(1.2)}
.slide .media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.slide .media img,.slide .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.slide .media .fill{object-fit:cover}
.slide .missing{color:var(--mut);font-size:14px;padding:30px;text-align:center}
.tapzone{position:absolute;inset:0;z-index:2}
.shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none;z-index:3;transition:opacity .2s}
.info{position:absolute;left:14px;right:78px;bottom:20px;z-index:4;transition:opacity .2s}
.who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.who .follow{margin-left:4px;border:1px solid rgba(255,255,255,.7);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.meta{margin-top:9px;font-size:13px;color:#e8e8e8;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.actions{position:absolute;right:6px;bottom:18px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:22px;width:60px;transition:opacity .2s}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.act svg{width:29px;height:29px}
.act.like.on{color:var(--red)}
.act.pop svg{animation:pop .4s ease}
.act.cover .av{width:30px;height:30px;border-radius:8px;border:2px solid #fff;font-size:13px}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.22);z-index:5}
.prog i{display:block;height:100%;width:0;background:rgba(255,255,255,.9)}
.burst{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:6;opacity:0;pointer-events:none;color:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
.burst svg{width:100%;height:100%}
.burst.go{animation:burst .85s ease}
.flash{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:6;opacity:0;pointer-events:none}
.flash svg{width:30px;height:30px}
.flash.go{animation:flash .8s ease}
.slide.clean .info,.slide.clean .actions,.slide.clean .shade{opacity:0}
.playbig{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:5;pointer-events:none}.playbig svg{width:38px;height:38px;margin-left:5px}.slide.blocked .playbig{display:grid}
.slide .lo{position:absolute;top:calc(var(--st) + 60px);right:12px;z-index:4;font-size:11px;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:10px;color:#ddd}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes burst{0%{opacity:0;transform:scale(.3) rotate(-12deg)}15%{opacity:1;transform:scale(1.15) rotate(-12deg)}30%{transform:scale(.95) rotate(-12deg)}70%{opacity:1;transform:scale(1) rotate(-12deg)}100%{opacity:0;transform:scale(1) translateY(-60px) rotate(-12deg)}}
@keyframes flash{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}

.feed-top{position:absolute;top:0;left:0;right:0;z-index:10;padding-top:var(--st);background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none}
.chips{display:flex;gap:20px;overflow-x:auto;padding:12px 18px 16px;pointer-events:auto;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:17px;font-weight:700;color:rgba(255,255,255,.55);white-space:nowrap;position:relative;padding-bottom:5px;text-shadow:0 1px 3px rgba(0,0,0,.4);transition:color .15s}
.chip.on{color:#fff}
.chip.on::after{content:'';position:absolute;left:25%;right:25%;bottom:0;height:2px;border-radius:2px;background:#fff}
.chip.add{color:#fff;padding-bottom:3px}
.chip.add svg{width:22px;height:22px}
.vbar{display:flex;align-items:center;gap:6px;padding:6px 8px;pointer-events:auto}
.vbar b{font-size:17px}

/* avatars */
.av{display:inline-grid;place-items:center;border-radius:50%;background-color:hsl(var(--h,200) 40% 32%);background-size:cover;background-position:center;font-weight:700;flex:none;color:#fff;overflow:hidden;line-height:1}
.av.has-img{color:transparent}
.ring{padding:2.5px;border-radius:50%;background:linear-gradient(45deg,#ffc24b,#ff5470 55%,#b33bdb);display:inline-flex;flex:none}
.ring>.av{border:3px solid #000}
.ring.dim{background:#3a3a3a}

/* gallery / profile */
.ghead{position:sticky;top:0;z-index:6;background:#000;padding:var(--st) 6px 0 14px;height:calc(var(--st) + 52px);display:flex;align-items:center;gap:4px}
.ghead .title{font-size:21px;font-weight:700;display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.ghead .title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead .title svg{width:18px;height:18px;flex:none}
.ghead.sel .title{font-size:17px}
.icobtn{width:44px;height:44px;display:grid;place-items:center;flex:none}
.icobtn svg{width:26px;height:26px}
.txtbtn{font-weight:600;font-size:15px;padding:8px 10px}
.txtbtn.red{color:var(--red)} .txtbtn.blue{color:var(--blue)}
.txtbtn:disabled{opacity:.35}
.prof{display:flex;align-items:center;gap:18px;padding:8px 16px 10px}
.prof .ring>.av{width:82px;height:82px;font-size:32px}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px;font-weight:700}
.stats span{font-size:13px;color:#e6e6e6}
.pname{padding:0 16px;font-weight:600;font-size:14px}
.pbio{padding:2px 16px 0;font-size:14px;color:var(--mut)}
.pbtns{display:flex;gap:6px;padding:12px 16px 4px}
.pbtn{flex:1;height:34px;border-radius:8px;background:var(--btn);font-weight:600;font-size:14px}
.pbtn.blue{background:var(--blue)}
.hl{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 14px;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.hl button{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;flex:none;font-size:12px}
.hl .lbl{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .ring>.av,.hl .newc{width:58px;height:58px;font-size:22px}
.hl .newc{border-radius:50%;border:1.5px solid #555;display:grid;place-items:center;margin:2.5px}
.hl .newc svg{width:26px;height:26px}
.gtabs{display:flex;position:sticky;top:calc(var(--st) + 52px);background:#000;z-index:5}
.gtabs button{flex:1;height:44px;display:grid;place-items:center;color:#777;border-bottom:1px solid var(--line)}
.gtabs button.on{color:#fff;border-bottom:1.5px solid #fff}
.gtabs svg{width:24px;height:24px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:1.5px;padding-bottom:20px}
.tile{position:relative;aspect-ratio:1;background:#161616;overflow:hidden}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .badge{position:absolute;top:4px;right:4px;display:flex;align-items:center;gap:2px;font-size:11px;font-weight:600;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.tile .badge svg{width:14px;height:14px}
.tile .lk{position:absolute;bottom:3px;left:4px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.tile .lk svg{width:12px;height:12px}
.tile .chk{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.25)}
.tile.sel::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.28)}
.tile.sel .chk{background:var(--blue);border-color:var(--blue)}
.tile.sel .chk::after{content:'';position:absolute;left:6px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cols3 .tile .badge{top:6px;right:6px}.cols3 .tile .badge svg{width:18px;height:18px}
.note{color:var(--mut);font-size:12px;text-align:center;padding:14px 20px 26px}

/* empty states */
.empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:12px;z-index:3}
.empty.on{display:flex}
.empty .circ{width:88px;height:88px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;margin-bottom:6px}
.empty .circ svg{width:44px;height:44px}
.empty h2{margin:0;font-size:22px}
.empty p{margin:0;color:var(--mut);font-size:14px;max-width:290px;line-height:1.4}
.empty .pbtn{flex:none;padding:0 22px;margin-top:8px;height:38px}
.gempty{position:relative;inset:auto;display:flex;padding:50px 30px}

/* sheets & dialogs */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#262626;border-radius:16px 16px 0 0;padding:8px 0 calc(10px + var(--sb));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:80%;overflow-y:auto}
.backdrop.open .sheet{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#666;margin:2px auto 10px}
.sheet h4{margin:0 0 6px;text-align:center;font-size:16px;font-weight:700;padding:4px 16px 10px;border-bottom:1px solid #363636}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 20px;font-size:16px}
.sheet .opt svg{width:24px;height:24px;flex:none}
.sheet .opt.red{color:var(--red)}
.sheet .opt .sub{color:var(--mut);font-size:13px;margin-left:auto}
.sheet .opt.cur .sub{color:var(--blue)}
.sheet .row{display:flex;align-items:center;gap:12px;padding:9px 12px 9px 18px}
.sheet .row .pick{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.sheet .row .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .row .ct{color:var(--mut);font-size:13px}
.sheet .row .av{width:52px;height:52px;font-size:20px}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid #777;flex:none}
.radio.on{border:7px solid var(--blue)}
.dlg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.96);width:min(290px,86vw);background:#262626;border-radius:14px;overflow:hidden;text-align:center;transition:transform .2s}
.backdrop.open .dlg{transform:translate(-50%,-50%)}
.dlg h3{margin:22px 18px 6px;font-size:18px}
.dlg p{margin:0 20px 16px;color:var(--mut);font-size:14px;line-height:1.4}
.dlg input{width:calc(100% - 36px);margin:8px 18px 18px;background:#121212;border:1px solid #3a3a3a;border-radius:10px;color:#fff;font-size:16px;padding:11px 12px;outline:none;-webkit-user-select:text;user-select:text}
.dlg input:focus{border-color:#666}
.dlg .btns button{display:block;width:100%;padding:13px;border-top:1px solid #3a3a3a;font-size:15px}
.dlg .btns .primary{color:var(--blue);font-weight:700}
.dlg .btns .danger{color:var(--red);font-weight:700}

/* toast / progress / banner */
.toast{position:absolute;left:50%;bottom:calc(var(--tab) + var(--sb) + 18px);transform:translate(-50%,20px);background:#f5f5f5;color:#000;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prog-pill{position:absolute;left:50%;top:calc(var(--st) + 60px);transform:translate(-50%,-10px);background:rgba(38,38,38,.96);font-size:14px;font-weight:600;padding:9px 16px 9px 12px;border-radius:20px;z-index:60;display:flex;align-items:center;gap:10px;opacity:0;transition:all .25s;pointer-events:none}
.prog-pill.on{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #555;border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;z-index:80;color:var(--mut);font-size:14px}
#loading .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(45deg,#ffc24b,#ff5470 55%,#b33bdb);display:grid;place-items:center}
#loading .logo svg{width:34px;height:34px}
#loading.gone{opacity:0;pointer-events:none;transition:opacity .3s}
.banner{position:absolute;left:12px;right:12px;bottom:calc(var(--tab) + var(--sb) + 12px);z-index:40;background:rgba(38,38,38,.97);border-radius:12px;padding:10px 12px;font-size:13px;display:none;align-items:center;gap:10px;line-height:1.35}
.banner.on{display:flex}
.banner span{flex:1}
.banner button{font-weight:700;color:var(--blue);padding:4px}
</style>
</head>
<body>
<div id="app">
  <section id="feedView" class="view on">
    <div id="feed" class="feed"></div>
    <div class="feed-top"><div id="chips" class="chips"></div></div>
    <div id="feedEmpty" class="empty"></div>
  </section>

  <section id="galleryView" class="view scroll"></section>

  <section id="viewerView" class="view">
    <div id="vfeed" class="feed"></div>
    <div class="feed-top"><div class="vbar"><button class="icobtn" id="vback" aria-label="Back"></button><b id="vtitle">Posts</b></div></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button data-tab="feed" aria-label="Home"></button>
    <button data-tab="spaces" aria-label="Spaces"></button>
    <button data-tab="add" aria-label="Add media"></button>
    <button data-tab="gallery" class="me" aria-label="Gallery"></button>
  </nav>

  <div id="banner" class="banner"><span id="bannerTxt"></span><button id="bannerX">OK</button></div>
  <div id="progPill" class="prog-pill"><div class="spin"></div><span id="progTxt"></span></div>
  <div id="toast" class="toast"></div>
  <div id="sheetBg" class="backdrop"></div>
  <div id="dlgBg" class="backdrop"></div>
  <div id="loading"><div class="logo"></div><div class="spin"></div></div>
  <input type="file" id="picker" accept="image/*,video/*" multiple hidden>
</div>

<script>
"use strict";const APP_VERSION="6";(function(){try{fetch("./index.html?nc="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{const m=t.match(/APP_VERSION="(\d+)"/);if(m&&m[1]!==APP_VERSION&&!location.search.includes("v="+m[1]))location.replace(location.pathname+"?v="+m[1])}).catch(()=>{})}catch(e){}})();
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,180,180,0);g.addColorStop(0,'#ffc24b');g.addColorStop(.55,'#ff5470');g.addColorStop(1,'#b33bdb');x.fillStyle=g;x.fillRect(0,0,180,180);x.strokeStyle='#fff';x.lineWidth=9;x.lineJoin='round';x.lineCap='round';x.beginPath();x.moveTo(90,40);x.lineTo(147,67);x.lineTo(90,94);x.lineTo(33,67);x.closePath();x.stroke();[100,123].forEach(y=>{x.beginPath();x.moveTo(33,y);x.lineTo(90,y+27);x.lineTo(147,y);x.stroke()});document.getElementById('appIcon').href=c.toDataURL('image/png')}catch(e){}})();

/* ---------- icons ---------- */
const sv=(p,f)=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="${f?0:2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const HEART='<path d="M12 20.6s-7.4-4.5-9.2-9.1C1.6 8.2 3.7 4.6 7.3 4.6c2 0 3.5 1.1 4.7 2.9 1.2-1.8 2.7-2.9 4.7-2.9 3.6 0 5.7 3.6 4.5 6.9-1.8 4.6-9.2 9.1-9.2 9.1z"/>';
const I={
 home:sv('<path d="M3.5 10.2 12 3.5l8.5 6.7V20a.5.5 0 0 1-.5.5h-5.2v-6h-5.6v6H4a.5.5 0 0 1-.5-.5z"/>'),
 homeF:sv('<path d="M3.5 10.2 12 3.5l8.5 6.7V20a.5.5 0 0 1-.5.5h-5.2v-6h-5.6v6H4a.5.5 0 0 1-.5-.5z" fill="currentColor"/>'),
 layers:sv('<path d="m12 3.5 9 4.8-9 4.8-9-4.8z"/><path d="m3 12.4 9 4.8 9-4.8"/><path d="m3 16.4 9 4.8 9-4.8"/>'),
 add:sv('<rect x="3" y="3" width="18" height="18" rx="5.5"/><path d="M12 8v8M8 12h8"/>'),
 plus:sv('<path d="M12 5v14M5 12h14"/>'),
 heart:sv(HEART), heartF:sv(HEART,1),
 grid:sv('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>'),
 more:sv('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',1),
 back:sv('<path d="M15 4.5 7.5 12l7.5 7.5"/>'),
 down:sv('<path d="m6 9 6 6 6-6"/>'),
 menu:sv('<path d="M3.5 6h17M3.5 12h17M3.5 18h17"/>'),
 play:sv('<path d="M7 4.5v15l12.5-7.5z"/>',1),
 reels:sv('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M8.5 3l3 5.5M14.5 3l3 5.5"/><path d="m10 12 5 2.8-5 2.8z" fill="currentColor"/>'),
 volOn:sv('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'),
 volOff:sv('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="m16 9.5 5 5M21 9.5l-5 5"/>'),
 pause:sv('<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>',1),
 trash:sv('<path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 13h10l1-13M10 11v5M14 11v5"/>'),

const idbPut=(s,k,v)=>idbOp(s,'readwrite',o=>o.put(v,k));

async function getCap(name){return null;try{if(!window.claude||typeof window.claude.use!=='function')return null;return await Promise.race([window.claude.use(name),sleep(11000).then(()=>null)])}catch(e){return null}}

const urlCache=new Map();

const shuf=new Map();const rk=id=>{if(!shuf.has(id))shuf.set(id,Math.random());return shuf.get(id)};

class Feed{

  this.io.disconnect();

  return `<div class="slide" data-i="${i}">
   <div class="bg"></div><div class="media"></div><div class="tapzone"></div>
   ${vid?`<div class="playbig">${I.play}</div>`:''}<div class="burst">${I.heartF}</div><div class="flash"></div><div class="shade"></div>
   ${it.localOnly&&Store.mode==='cloud'?'<div class="lo">On this device</div>':''}
   <div class="info"><button class="who" data-act="open">${avatar(sp,34)}<span>${esc(sp.name)}</span><span class="follow">Gallery</span></button>
    <div class="meta">${vid?'Video':'Photo'}${vid&&it.dur?' · '+fmtDur(it.dur):''} · ${fmtDate(it.createdAt)} · ${i+1}/${this.items.length}</div></div>
   <div class="actions">
    <button class="act like${it.liked?' on':''}" data-act="like" aria-label="Like">${it.liked?I.heartF:I.heart}</button>
    <button class="act" data-act="grid" aria-label="Gallery">${I.grid}</button>
    <button class="act" data-act="more" aria-label="More">${I.more}</button>
    <button class="act cover" data-act="open" aria-label="Open space">${avatar(sp,30)}</button>
   </div>

 setActive(i){

  if(tu)bg.style.backgroundImage=`url("${tu}")`;
  const fill=it.w&&it.h&&(it.h/it.w)>1.55?' fill':'';

   if(tu){const im=new Image();im.alt='';im.className='poster'+fill;im.src=tu;media.prepend(im)}
   return;
  }

/* ---------- adding media ---------- */
function pick(){const p=$('#picker');p.value='';p.click()}
$('#picker').addEventListener('change',e=>{const f=[...e.target.files];if(f.length)handleFiles(f)});
async function handleFiles(files){
 let sp=curSpace();if(!sp){sp=await createSpace();if(!sp)return}
 const spaceId=sp.id,base=Date.now();let ok=0,fail=0,local=0;
 for(let k=0;k<files.length;k++){
  progress(files.length>1?`Adding ${k+1} of ${files.length}…`:'Adding…');
  try{const r=await addFile(files[k],spaceId,base+k);ok++;if(r.local)local++}catch(e){console.error(e);fail++}
 }
 progressDone();
 let msg=ok?`Added ${ok} to ${sp.name}`:'Nothing was added';
 if(fail)msg+=` · ${fail} failed`;
 if(local&&Store.mode==='cloud')msg+=` · ${local} too large for sync, kept on this device`;
 toast(msg);
 if(ok&&S.view==='feed'){mainFeed.lastIdx=0;mainFeed.key='';renderFeed();mainFeed.go(0)}
}
function isVideo(f){return (f.type||'').startsWith('video/')||/\.(mov|mp4|m4v|webm|3gp)$/i.test(f.name||'')}
async function addFile(f,spaceId,ts){
 const it={id:uid(),spaceId,createdAt:ts,liked:false};let local=false;
 if(isVideo(f)){
  it.type='video';
  const vt=(f.type||'').toLowerCase()==='video/webm'?'video/webm':'video/mp4';
  const {thumb,meta}=await videoThumb(f);
  const m=await Store.storeBlob(f,vt);it.src=m.ref;local=!!m.local;
  if(thumb){try{const t=await Store.storeBlob(thumb,'image/jpeg');it.thumb=t.ref}catch(e){}}
  Object.assign(it,meta);
 }else{
  it.type='image';
  const p=await processImage(f);
  const m=await Store.storeBlob(p.main,p.type);it.src=m.ref;local=!!m.local;
  if(p.thumb){try{const t=await Store.storeBlob(p.thumb,'image/jpeg');it.thumb=t.ref}catch(e){}}
  it.w=p.w;it.h=p.h;
 }
 if(local&&Store.mode==='cloud')it.localOnly=true;
 await Store.putItem(it);return{local};
}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url})}
function canvasJpeg(src,w,h,max,q){
 const s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
 const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q));
}
async function processImage(f){
 const url=URL.createObjectURL(f);
 try{
  const img=await loadImg(url);const w=img.naturalWidth,h=img.naturalHeight;
  const t=(f.type||'').toLowerCase();
  const keep=['image/jpeg','image/png','image/webp','image/gif'].includes(t)&&f.size<8e6&&Math.max(w,h)<=3200;
  const main=keep?f:await canvasJpeg(img,w,h,2560,.9);
  const thumb=await canvasJpeg(img,w,h,480,.78);
  if(!main)throw new Error('encode');
  return{main,type:keep?t:'image/jpeg',thumb,w,h};
 }finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
function videoThumb(f){
 return new Promise(res=>{
  const url=URL.createObjectURL(f);const v=document.createElement('video');
  let done=false,meta={};
  const fin=async draw=>{
   if(done)return;done=true;let blob=null;
   if(draw&&v.videoWidth){try{blob=await canvasJpeg(v,v.videoWidth,v.videoHeight,480,.78)}catch(e){}}
   try{v.removeAttribute('src');v.load()}catch(e){}URL.revokeObjectURL(url);res({thumb:blob,meta});
  };
  v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
  v.onloadedmetadata=()=>{meta={dur:num(v.duration),w:v.videoWidth||null,h:v.videoHeight||null};try{v.currentTime=Math.min(.05,(v.duration||1)/10)}catch(e){}};
  v.onseeked=()=>fin(true);
  v.onloadeddata=()=>setTimeout(()=>fin(true),1500);
  v.onerror=()=>fin(false);
  setTimeout(()=>fin(true),8000);
  v.src=url;v.load();
 });
}

(()=>{let t,id;const g=$('#galleryView');
 g.addEventListener('pointerdown',e=>{const tile=e.target.closest('.tile');if(!tile||S.select)return;id=tile.dataset.id;t=setTimeout(()=>{S.select=new Set([id]);renderGallery(true);if(navigator.vibrate)navigator.vibrate(10);g._sup=true},500)});
 const c=()=>clearTimeout(t);g.addEventListener('pointerup',c);g.addEventListener('pointercancel',c);g.addEventListener('pointermove',e=>{if(Math.abs(e.movementY||0)>2)c()});
 g.addEventListener('click',e=>{if(g._sup){g._sup=false;e.stopImmediatePropagation()}},true);
 g.addEventListener('contextmenu',e=>e.preventDefault());
})();
$('#vback').innerHTML=I.back;
$('#vback').onclick=()=>show('gallery');

// swipe left/right on the feed to switch spaces
(()=>{let sx,sy,st;const f=$('#feedView');
 f.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
 f.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2&&Date.now()-st<700){
   const sp=spacesSorted();if(sp.length<2)return;let i=sp.findIndex(s=>s.id===S.cur);i=(i+(dx<0?1:-1)+sp.length)%sp.length;setCur(sp[i].id);toast(sp[i].name);
  }},{passive:true});
})();
document.addEventListener('touchend',()=>{const f=S.view==='viewer'?viewFeed:S.view==='feed'?mainFeed:null;if(!f||f.held)return;const s=f.slideAt(f.active),p=f.cur();if(s&&p&&s.classList.contains('blocked')){p.muted=S.muted;p.play().catch(()=>{})}f.unlockAll()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){mainFeed.pauseAll();viewFeed.pauseAll()}else{if(S.view==='feed')mainFeed.setVisible(true);if(S.view==='viewer')viewFeed.setVisible(true)}});

/* ---------- boot ---------- */
$('#loading .logo').innerHTML=I.layers;
mainFeed=new Feed($('#feed'));viewFeed=new Feed($('#vfeed'));
mainFeed.visible=true;
let rq=false;Store.on(()=>{if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})});
Store.init().then(()=>{
 if(Store.mode==='local')render();
 setTimeout(()=>{if(spacesSorted().length>1&&!LS.get('swipeTip',false)){toast('Tip: swipe left or right to switch spaces');LS.set('swipeTip',true)}},1500);
});
</script>
</body>
