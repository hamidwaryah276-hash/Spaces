<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Spaces">
<link rel="apple-touch-icon" id="appIcon" href="">
<title>Spaces</title>
<style>
:root{--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8;--line:#262626;--card:#1c1c1e;--btn:#363636;--blue:#0095f6;--red:#ff3040;--tab:50px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--cols:5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden}
.view{position:absolute;left:0;right:0;top:0;bottom:calc(var(--tab) + var(--sb));display:none;background:#000}
.view.on{display:block}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);display:flex;align-items:center;background:#000;border-top:1px solid var(--line);z-index:30}
.tabbar button{flex:1;height:var(--tab);display:grid;place-items:center;color:#fff}
.tabbar svg{width:27px;height:27px}
.tabbar .me .av{width:28px;height:28px;font-size:12px}
.tabbar .me.on .av{outline:2px solid #fff;outline-offset:1px}

/* reels feed */
.feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.slide .bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(36px) brightness(.4) saturate(1.2)}
.slide .media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.slide .media img,.slide .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.slide .media .fill{object-fit:cover}
.slide .missing{color:var(--mut);font-size:14px;padding:30px;text-align:center}
.tapzone{position:absolute;inset:0;z-index:2}
.shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none;z-index:3;transition:opacity .2s}
.info{position:absolute;left:14px;right:78px;bottom:20px;z-index:4;transition:opacity .2s}
.who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.who .follow{margin-left:4px;border:1px solid rgba(255,255,255,.7);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.meta{margin-top:9px;font-size:13px;color:#e8e8e8;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.actions{position:absolute;right:6px;bottom:18px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:22px;width:60px;transition:opacity .2s}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.act svg{width:29px;height:29px}
.act.like.on{color:var(--red)}
.act.pop svg{animation:pop .4s ease}
.act.cover .av{width:30px;height:30px;border-radius:8px;border:2px solid #fff;font-size:13px}
.prog{position:absolute;left:0;right:0;bottom:0;height:18px;z-index:5;touch-action:none}
.prog s{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.22);transition:height .15s}
.prog i{position:absolute;left:0;bottom:0;height:2px;width:0;background:rgba(255,255,255,.9);transition:height .15s}
.prog.on s,.prog.on i{height:6px}.prog.on i{background:#fff}
.prog em{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-style:normal;font-size:15px;font-weight:600;background:rgba(0,0,0,.65);padding:5px 12px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
.prog.on em{opacity:1}
.prog.ph{pointer-events:none;height:2px}
.feed:not(.auto) .prog.ph{display:none}
.slide.isalb.pv .prog.ph{display:none}
.slide.isalb:not(.pv) .prog.sc{display:none}
.burst{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:6;opacity:0;pointer-events:none;color:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
.burst svg{width:100%;height:100%}
.burst.go{animation:burst .85s ease}
.flash{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:6;opacity:0;pointer-events:none}
.flash svg{width:30px;height:30px}
.flash.go{animation:flash .8s ease}
.slide.clean .info,.slide.clean .actions,.slide.clean .shade{opacity:0}
.playbig{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:5;pointer-events:none}.playbig svg{width:38px;height:38px;margin-left:5px}.slide.blocked .playbig{display:grid}
.slide .lo{position:absolute;top:calc(var(--st) + 60px);right:12px;z-index:4;font-size:11px;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:10px;color:#ddd}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes burst{0%{opacity:0;transform:scale(.3) rotate(-12deg)}15%{opacity:1;transform:scale(1.15) rotate(-12deg)}30%{transform:scale(.95) rotate(-12deg)}70%{opacity:1;transform:scale(1) rotate(-12deg)}100%{opacity:0;transform:scale(1) translateY(-60px) rotate(-12deg)}}
@keyframes flash{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}

.fgear{position:absolute;right:6px;top:calc(var(--st) + 4px);z-index:11;width:44px;height:44px;display:grid;place-items:center;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}.fgear svg{width:25px;height:25px}
#feedView .chips{padding-right:56px}
.set-sec{padding:18px 16px 6px;color:var(--mut);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.set-card{margin:0 12px;background:#161616;border-radius:14px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid #262626;width:100%;text-align:left}
.set-row:first-child{border-top:0}
.set-row .ic{width:24px;height:24px;flex:none}.set-row .ic svg{width:24px;height:24px}
.set-row .tx{flex:1;min-width:0}.set-row .tx b{display:block;font-size:16px;font-weight:500}.set-row .tx small{display:block;color:var(--mut);font-size:13px;margin-top:3px;line-height:1.35}
.sw{width:51px;height:31px;border-radius:16px;background:#3a3a3a;position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:#2a2a2a;border-radius:9px;padding:2px;flex:none}
.seg button{padding:6px 12px;border-radius:7px;font-size:14px;font-weight:600;color:#bbb}.seg button.on{background:#555;color:#fff}
.set-row.blue b{color:var(--blue)}
.feed-top{position:absolute;top:0;left:0;right:0;z-index:10;padding-top:var(--st);background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none}
.chips{display:flex;gap:20px;overflow-x:auto;padding:12px 18px 16px;pointer-events:auto;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:17px;font-weight:700;color:rgba(255,255,255,.55);white-space:nowrap;position:relative;padding-bottom:5px;text-shadow:0 1px 3px rgba(0,0,0,.4);transition:color .15s}
.chip.on{color:#fff}
.chip.on::after{content:'';position:absolute;left:25%;right:25%;bottom:0;height:2px;border-radius:2px;background:var(--c,#fff)}
.chip.add{color:#fff;padding-bottom:3px}
.chip.add svg{width:22px;height:22px}
.vbar{display:flex;align-items:center;gap:6px;padding:6px 8px;pointer-events:auto}
.vbar b{font-size:17px}

/* avatars */
.av{display:inline-grid;place-items:center;border-radius:50%;background-color:hsl(var(--h,200) 40% 32%);background-size:cover;background-position:center;font-weight:700;flex:none;color:#fff;overflow:hidden;line-height:1}
.av.has-img{color:transparent}
.ring{padding:2.5px;border-radius:50%;background:linear-gradient(45deg,#ffc24b,#ff5470 55%,#b33bdb);display:inline-flex;flex:none}
.ring>.av{border:3px solid #000}
.ring.dim{background:#3a3a3a}

/* gallery / profile */
.ghead{position:sticky;top:0;z-index:6;background:#000;padding:var(--st) 6px 0 14px;height:calc(var(--st) + 52px);display:flex;align-items:center;gap:4px}
.ghead .title{font-size:21px;font-weight:700;display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.ghead .title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead .title svg{width:18px;height:18px;flex:none}
.ghead.sel .title{font-size:17px}
.icobtn{width:44px;height:44px;display:grid;place-items:center;flex:none}
.icobtn svg{width:26px;height:26px}
.txtbtn{font-weight:600;font-size:15px;padding:8px 10px}
.txtbtn.red{color:var(--red)} .txtbtn.blue{color:var(--blue)}
.txtbtn:disabled{opacity:.35}
.prof{display:flex;align-items:center;gap:18px;padding:8px 16px 10px}
.prof .ring>.av{width:82px;height:82px;font-size:32px}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px;font-weight:700}
.stats span{font-size:13px;color:#e6e6e6}
.pname{padding:0 16px;font-weight:600;font-size:14px}
.pbio{padding:2px 16px 0;font-size:14px;color:var(--mut)}
.pbtns{display:flex;gap:6px;padding:12px 16px 4px}
.pbtn{flex:1;height:34px;border-radius:8px;background:var(--btn);font-weight:600;font-size:14px}
.pbtn.blue{background:var(--blue)}
.hl{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 14px;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.hl button{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;flex:none;font-size:12px}
.hl .lbl{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .ring>.av,.hl .newc{width:58px;height:58px;font-size:22px}
.hl .newc{border-radius:50%;border:1.5px solid #555;display:grid;place-items:center;margin:2.5px}
.hl .newc svg{width:26px;height:26px}
.gtabs{display:flex;position:sticky;top:calc(var(--st) + 52px);background:#000;z-index:5}
.gtabs button{flex:1;height:44px;display:grid;place-items:center;color:#777;border-bottom:1px solid var(--line)}
.gtabs button.on{color:#fff;border-bottom:1.5px solid #fff}
.gtabs svg{width:24px;height:24px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:1.5px;padding-bottom:20px}
.tile{position:relative;aspect-ratio:1;background:#161616;overflow:hidden}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .badge{position:absolute;top:4px;right:4px;display:flex;align-items:center;gap:2px;font-size:11px;font-weight:600;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.tile .badge svg{width:14px;height:14px}
.tile .lk{position:absolute;bottom:3px;left:4px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.tile .lk svg{width:12px;height:12px}
.tile .chk{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.25)}
.tile.sel::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.28)}
.tile.sel .chk{background:var(--blue);border-color:var(--blue)}
.tile.sel .chk::after{content:'';position:absolute;left:6px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cols3 .tile .badge{top:6px;right:6px}.cols3 .tile .badge svg{width:18px;height:18px}
.note{color:var(--mut);font-size:12px;text-align:center;padding:14px 20px 26px}

/* empty states */
.empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:12px;z-index:3}
.empty.on{display:flex}
.empty .circ{width:88px;height:88px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;margin-bottom:6px}
.empty .circ svg{width:44px;height:44px}
.empty h2{margin:0;font-size:22px}
.empty p{margin:0;color:var(--mut);font-size:14px;max-width:290px;line-height:1.4}
.empty .pbtn{flex:none;padding:0 22px;margin-top:8px;height:38px}
.gempty{position:relative;inset:auto;display:flex;padding:50px 30px}

/* sheets & dialogs */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#262626;border-radius:16px 16px 0 0;padding:8px 0 calc(10px + var(--sb));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:80%;overflow-y:auto}
.backdrop.open .sheet{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#666;margin:2px auto 10px}
.sheet h4{margin:0 0 6px;text-align:center;font-size:16px;font-weight:700;padding:4px 16px 10px;border-bottom:1px solid #363636}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 20px;font-size:16px}
.sheet .opt svg{width:24px;height:24px;flex:none}
.sheet .opt.red{color:var(--red)}
.sheet .opt .sub{color:var(--mut);font-size:13px;margin-left:auto}
.sheet .opt.cur .sub{color:var(--blue)}
.sheet .row{display:flex;align-items:center;gap:12px;padding:9px 12px 9px 18px}
.sheet .row .pick{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.sheet .row .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .row .ct{color:var(--mut);font-size:13px}
.sheet .row .av{width:52px;height:52px;font-size:20px}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid #777;flex:none}
.radio.on{border:7px solid var(--blue)}
.dlg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.96);width:min(290px,86vw);background:#262626;border-radius:14px;overflow:hidden;text-align:center;transition:transform .2s}
.backdrop.open .dlg{transform:translate(-50%,-50%)}
.dlg h3{margin:22px 18px 6px;font-size:18px}
.dlg p{margin:0 20px 16px;color:var(--mut);font-size:14px;line-height:1.4}
.dlg input{width:calc(100% - 36px);margin:8px 18px 18px;background:#121212;border:1px solid #3a3a3a;border-radius:10px;color:#fff;font-size:16px;padding:11px 12px;outline:none;-webkit-user-select:text;user-select:text}
.dlg input:focus{border-color:#666}
.dlg .btns button{display:block;width:100%;padding:13px;border-top:1px solid #3a3a3a;font-size:15px}
.dlg .btns .primary{color:var(--blue);font-weight:700}
.dlg .btns .danger{color:var(--red);font-weight:700}

/* toast / progress / banner */
.toast{position:absolute;left:50%;bottom:calc(var(--tab) + var(--sb) + 18px);transform:translate(-50%,20px);background:#f5f5f5;color:#000;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prog-pill{position:absolute;left:50%;top:calc(var(--st) + 60px);transform:translate(-50%,-10px);background:rgba(38,38,38,.96);font-size:14px;font-weight:600;padding:9px 16px 9px 12px;border-radius:20px;z-index:60;display:flex;align-items:center;gap:10px;opacity:0;transition:all .25s;pointer-events:none}
.prog-pill.on{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #555;border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;z-index:80;color:var(--mut);font-size:14px}
#loading .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(45deg,#ffc24b,#ff5470 55%,#b33bdb);display:grid;place-items:center}
#loading .logo svg{width:34px;height:34px}
#loading.gone{opacity:0;pointer-events:none;transition:opacity .3s}
.banner{position:absolute;left:12px;right:12px;bottom:calc(var(--tab) + var(--sb) + 12px);z-index:40;background:rgba(38,38,38,.97);border-radius:12px;padding:10px 12px;font-size:13px;display:none;align-items:center;gap:10px;line-height:1.35}
.banner.on{display:flex}
.banner span{flex:1}
.banner button{font-weight:700;color:var(--blue);padding:4px}
.av.lockd{background:#262626!important;color:#bbb}.av.lockd svg{width:52%;height:52%}
.chip .lk{display:inline-block;width:13px;height:13px;margin-left:4px;vertical-align:-1px}.chip .lk svg{width:13px;height:13px}
#pinBg{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px)}
#pinBg.open{display:flex}
#pinBg .pt{font-size:19px;font-weight:600;margin-bottom:6px;text-align:center}
#pinBg .ps{font-size:14px;color:var(--mut);min-height:20px;margin-bottom:22px;text-align:center}
#pinBg .ps.err{color:var(--red)}
.dots{display:flex;gap:18px;margin-bottom:44px}.dots.shake{animation:shake .4s}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.pad button{width:78px;height:78px;border-radius:50%;background:#2a2a2a;font-size:30px;font-weight:400}
.pad button:active{background:#555}.pad .nob{background:none;font-size:16px}.pad .nob:active{background:none;opacity:.5}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.alb{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.alb::-webkit-scrollbar{display:none}
.ap{position:relative;flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden}
.acnt{position:absolute;top:calc(var(--st) + 58px);right:12px;z-index:4;font-size:12px;font-weight:600;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:12px;pointer-events:none}
.adots{position:absolute;left:0;right:0;bottom:7px;z-index:4;display:flex;justify-content:center;gap:5px;pointer-events:none}
.adots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}.adots i.on{background:#fff}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.tags:empty{display:none}
.tags button{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.chip .em{margin-right:5px}
.ghead .title .em{font-size:19px;margin-right:2px}
.av.em{font-weight:400}
.gsearch{margin:4px 16px 6px;display:flex;align-items:center;gap:8px;background:#262626;border-radius:10px;padding:0 6px 0 10px;height:38px}
.gsearch svg{width:18px;height:18px;color:var(--mut);flex:none}
.gsearch input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;padding:0}
.gsearch input::-webkit-search-cancel-button{display:none}
.gsearch button{width:28px;height:28px;border-radius:50%;font-size:20px;color:var(--mut);flex:none}
.gsearch input:placeholder-shown+button{display:none}

 select:sv('<circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.7L16 9.5"/>'),

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LS={get(k,d){try{const v=localStorage.getItem('spc_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('spc_'+k,JSON.stringify(v))}catch(e){}}};
const hue=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const fmtDate=ts=>{try{const d=new Date(ts),n=new Date();return d.toLocaleDateString(undefined,d.getFullYear()===n.getFullYear()?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'})}catch(e){return''}};
const fmtDur=s=>{if(!s||!isFinite(s))return'';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const num=v=>(typeof v==='number'&&isFinite(v))?v:null;
const fmtSize=b=>{b=+b||0;if(b<1)return'0 MB';const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return (i>=2?b.toFixed(b<10?1:0):Math.round(b))+' '+u[i]};
const fmtT=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const tagsHTML=it=>(it.tags||[]).map(t=>`<button data-act="tag" data-t="${esc(t)}">#${esc(t)}</button>`).join('');
const normTags=s=>String(s||'').split(/[\s,]+/).map(t=>t.replace(/^#+/,'').toLowerCase().replace(/[^\p{L}\p{N}_-]/gu,'').slice(0,30)).filter(Boolean);
const okColor=c=>/^#[0-9a-f]{6}$/i.test(c||'');
const itemRefs=it=>{const r=new Set([it.src,it.thumb]);(it.parts||[]).forEach(p=>{r.add(p.src);r.add(p.thumb)});r.delete(undefined);r.delete(null);return [...r]};
const NOTE_LOCAL='Saved on this iPhone';

/* ---------- IndexedDB (device storage) ---------- */
let _idb;
function idb(){if(_idb)return _idb;_idb=new Promise((res,rej)=>{try{const r=indexedDB.open('spaces-app',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs');if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return _idb}
async function idbOp(store,mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const req=fn(t.objectStore(store));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const idbGet=(s,k)=>idbOp(s,'readonly',o=>o.get(k));
const idbPut=(s,k,v)=>idbOp(s,'readwrite',o=>o.put(v,k));
const idbDel=(s,k)=>idbOp(s,'readwrite',o=>o.delete(k));

async function getCap(name){return null;try{if(!window.claude||typeof window.claude.use!=='function')return null;return await Promise.race([window.claude.use(name),sleep(11000).then(()=>null)])}catch(e){return null}}

/* ---------- store ---------- */
const Store={
 mode:'loading',db:null,assets:null,spaces:[],items:[],ready:false,subs:[],
 on(f){this.subs.push(f)},
 emit(){coverCache.clear();this.subs.forEach(f=>f())},
 async init(){
  const [db,assets]=await Promise.all([getCap('db'),getCap('assets')]);
  this.db=db;this.assets=assets;
  if(db){
   this.mode='cloud';
   const got={s:false,i:false};
   const timer=setTimeout(()=>{if(!this.ready){this.ready=true;showBanner("Can't reach your saved media yet. Check your connection.");this.emit()}},10000);
   const done=()=>{if(got.s&&got.i&&!this.ready){this.ready=true;clearTimeout(timer)}this.emit()};
   const fail=e=>{clearTimeout(timer);this.ready=true;showBanner('Your saved media is unavailable right now ('+(e&&e.code||'error')+').');this.emit()};
   db.collection('spaces').onSnapshot(s=>{this.spaces=s.docs.map(d=>({...d.data(),id:d.id}));if(!s.metadata.fromCache)got.s=true;done()},fail);
   db.collection('items').onSnapshot(s=>{this.items=s.docs.map(d=>({...d.data(),id:d.id}));if(!s.metadata.fromCache)got.i=true;done()},fail);
   if(!assets)showBanner('Uploads to your account aren\'t available here, so new media is saved on this device only.',true);
  }else{
   this.mode='local';
   try{const st=await idbGet('kv','state');if(st){this.spaces=st.spaces||[];this.items=st.items||[]}}catch(e){}
   this.ready=true;
   try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
   if(!LS.get('localNote',false)&&!navigator.standalone)showBanner('Tip: tap Share, then Add to Home Screen, to use Spaces as a full-screen app.',true,'localNote');
   this.emit();
  }
 },
 async saveLocal(){if(this.mode!=='local')return;try{await idbPut('kv','state',{spaces:this.spaces,items:this.items})}catch(e){toast("Couldn't save on this device")}},
 col(n){return this.db.collection(n)},
 async putSpace(s){if(this.mode==='cloud'){const{id,...d}=s;await this.col('spaces').doc(id).set(clean(d))}else{const i=this.spaces.findIndex(x=>x.id===s.id);if(i<0)this.spaces.push(s);else this.spaces[i]=s;this.emit();await this.saveLocal()}},
 async patchSpace(id,p){if(this.mode==='cloud')await this.col('spaces').doc(id).update(clean(p));else{const s=this.spaces.find(x=>x.id===id);if(s)Object.assign(s,p);this.emit();await this.saveLocal()}},
 async delSpace(id){if(this.mode==='cloud')await this.col('spaces').doc(id).delete();else{this.spaces=this.spaces.filter(x=>x.id!==id);this.emit();await this.saveLocal()}},
 async putItem(it){if(this.mode==='cloud'){const{id,...d}=it;await this.col('items').doc(id).set(clean(d))}else{this.items.push(it);this.emit();await this.saveLocal()}},
 async patchItem(id,p){
  const it=this.items.find(x=>x.id===id);if(it)Object.assign(it,p);
  if(this.mode==='cloud'){this.emit();await this.col('items').doc(id).update(clean(p))}else{this.emit();await this.saveLocal()}
 },
 async addItems(arr){if(!arr.length)return;if(this.mode==='cloud'){for(const it of arr){const{id,...d}=it;await this.col('items').doc(id).set(clean(d))}}else{this.items.push(...arr);this.emit();await this.saveLocal()}},
 async addSpaces(arr){if(!arr.length)return;if(this.mode==='cloud'){for(const x of arr){const{id,...d}=x;await this.col('spaces').doc(id).set(clean(d))}}else{this.spaces.push(...arr);this.emit();await this.saveLocal()}},
 async delRecords(ids){const st=new Set(ids);if(this.mode==='cloud'){for(const id of ids)await this.col('items').doc(id).delete()}else{this.items=this.items.filter(x=>!st.has(x.id));this.emit();await this.saveLocal()}},
 async patchItems(list){if(!list.length)return;for(const[id,p]of list){const it=this.items.find(x=>x.id===id);if(it)Object.assign(it,p)}this.emit();if(this.mode==='cloud'){for(const[id,p]of list)await this.col('items').doc(id).update(clean(p))}else await this.saveLocal()},
 async patchSpaces(list){if(!list.length)return;if(this.mode==='cloud'){for(const[id,p]of list)await this.col('spaces').doc(id).update(clean(p))}else{for(const[id,p]of list){const x=this.spaces.find(y=>y.id===id);if(x)Object.assign(x,p)}this.emit();await this.saveLocal()}},
 async delItem(it){
  for(const r of itemRefs(it))await this.dropBlob(r);
  if(this.mode==='cloud')await this.col('items').doc(it.id).delete();
  else{this.items=this.items.filter(x=>x.id!==it.id);this.emit();await this.saveLocal()}
 },
 async storeBlob(blob,type){
  let why=null;
  if(this.assets){
   for(let a=0;a<2;a++){
    try{const r=await this.assets.upload(blob,{type});return{ref:'a:'+r.id}}
    catch(e){why=e&&e.code;if(why==='store_unavailable'&&a===0){await sleep(900);continue}break}
   }
  }

// drag the handle to reorder spaces
$('#sheetBg').addEventListener('pointerdown',e=>{
 const h=e.target.closest('[data-h]');if(!h)return;
 e.preventDefault();
 const row=h.closest('.row'),sh=row.parentNode;sh._drag=1;
 try{h.setPointerCapture(e.pointerId)}catch(_){}
 let y0=e.clientY;row.classList.add('drag');
 const mv=ev=>{
  let dy=ev.clientY-y0;
  const nx=row.nextElementSibling,pv=row.previousElementSibling;
  if(nx&&nx.classList.contains('row')&&dy>nx.offsetHeight/2){sh.insertBefore(nx,row);y0+=nx.offsetHeight;dy=ev.clientY-y0}
  else if(pv&&pv.classList.contains('row')&&dy<-pv.offsetHeight/2){sh.insertBefore(row,pv);y0-=pv.offsetHeight;dy=ev.clientY-y0}
  row.style.transform=`translateY(${dy}px)`;
 };
 const up=async()=>{
  h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
  row.style.transform='';row.classList.remove('drag');
  const ids=[...sh.querySelectorAll('.row[data-rid]')].map(r=>r.dataset.rid);
  const ch=[];ids.forEach((id,k)=>{const s=Store.spaces.find(x=>x.id===id);if(s&&s.order!==k)ch.push([id,{order:k}])});
  sh._drag=0;
  if(ch.length){try{await Store.patchSpaces(ch)}catch(err){toast("Couldn't save the new order")}}
 };
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);

/* Face ID (WebAuthn platform authenticator) */
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const faceOn=()=>!!(LS.get('faceid',false)&&LS.get('fid',null)&&window.PublicKeyCredential&&navigator.credentials);
async function faceEnroll(){
 busy(true);
 try{
  const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Spaces'},user:{id:rnd(16),name:'Spaces',displayName:'Spaces'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
  if(!c)return false;LS.set('fid',b64u(c.rawId));LS.set('faceid',true);return true;
 }catch(e){console.warn(e);return false}finally{setTimeout(()=>busy(false),500)}
}
async function faceVerify(){
 if(!faceOn())return false;busy(true);
 try{
  const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64u(LS.get('fid','')),transports:['internal']}],userVerification:'required',timeout:60000}});
  return !!a;
 }catch(e){console.warn(e);return false}finally{setTimeout(()=>busy(false),500)}
}

const MAGIC='SPCBAK01';
async function backupSpaces(sps,label,extra){
 if(!sps.length){toast('Nothing to back up');return}
 const ids=new Set(sps.map(s=>s.id));
 const its=Store.items.filter(i=>ids.has(i.spaceId));
 const keyOf=new Map(),blobs=[],data=[];let off=0,miss=0;
 busy(true);
 try{
  for(let n=0;n<its.length;n++){
   progress(`Preparing backup ${n+1} of ${its.length}…`);
   for(const r of itemRefs(its[n])){if(keyOf.has(r))continue;let b=null;try{b=await blobOf(r)}catch(e){}
    if(!b){keyOf.set(r,null);miss++;continue}
    const k='b'+blobs.length;keyOf.set(r,k);blobs.push({k,off,size:b.size,type:b.type||''});data.push(b);off+=b.size}
  }
  const mp=r=>r&&keyOf.get(r)?'@'+keyOf.get(r):null;
  const items=its.map(it=>{const o=JSON.parse(JSON.stringify(it));delete o.localOnly;o.src=mp(it.src);o.thumb=mp(it.thumb);if(o.parts)o.parts.forEach((p,k)=>{p.src=mp(it.parts[k].src);p.thumb=mp(it.parts[k].thumb)});return o});
  const head={app:'Spaces',v:1,created:Date.now(),spaces:JSON.parse(JSON.stringify(sps)),items,blobs};
  if(sps.some(s=>s.hidden)&&LS.get('hid',null))head.hid=LS.get('hid',null);
  const hb=new TextEncoder().encode(JSON.stringify(head));
  const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const nm=String(label).replace(/[^\p{L}\p{N} _-]/gu,'').trim().slice(0,30)||'space';

async function restoreFile(f){
 busy(true);
 try{
  progress('Reading backup…');
  if(await f.slice(0,8).text()!==MAGIC)throw new Error('That file is not a Spaces backup.');
  const L=parseInt(await f.slice(8,24).text(),10);if(!(L>0))throw new Error('This backup file is damaged.');
  const head=JSON.parse(await f.slice(24,24+L).text());const base=24+L;
  const bl=new Map((head.blobs||[]).map(b=>[b.k,b])),made=new Map();
  const get=async r=>{if(!r||r[0]!=='@')return null;const k=r.slice(1);if(made.has(k))return made.get(k);const b=bl.get(k);if(!b)return null;
   const m=await Store.storeBlob(f.slice(base+b.off,base+b.off+b.size,b.type||''),b.type||'application/octet-stream');made.set(k,m.ref);return m.ref};
  const haveSp=new Set(Store.spaces.map(s=>s.id)),haveIt=new Set(Store.items.map(i=>i.id));
  let mx=Math.floor(Store.spaces.reduce((m,s)=>Math.max(m,spOrd(s)),0));
  const newSps=(head.spaces||[]).filter(s=>s&&s.id&&!haveSp.has(s.id)).map(s=>({...s,order:++mx}));
  if(newSps.length)await Store.addSpaces(newSps);
  if(head.hid&&!LS.get('hid',null))LS.set('hid',head.hid);
  const todo=(head.items||[]).filter(i=>i&&i.id&&!haveIt.has(i.id));
  let batch=[],added=0;
  for(let n=0;n<todo.length;n++){
   progress(`Restoring ${n+1} of ${todo.length}…`);const it=todo[n];
   try{
    it.src=await get(it.src);const th=await get(it.thumb);if(th)it.thumb=th;else delete it.thumb;
    if(it.parts){for(const p of it.parts){p.src=await get(p.src);const pt=await get(p.thumb);if(pt)p.thumb=pt;else delete p.thumb}it.parts=it.parts.filter(p=>p.src);if(!it.parts.length)continue;albumOf(it.parts,it)}
    if(!it.src)continue;
    delete it.localOnly;
    batch.push(it);added++;
    if(batch.length>=40){await Store.addItems(batch);batch=[]}
   }catch(e){console.error(e)}
  }
  if(batch.length)await Store.addItems(batch);
  progressDone();
  const same=(head.items||[]).length-todo.length;
  toast(`Restored ${newSps.length} space${newSps.length===1?'':'s'} and ${added} post${added===1?'':'s'}${same?` · ${same} were already here`:''}`);
  S.gkey='';render();
 }catch(e){console.error(e);progressDone();toast(e&&e.message&&/backup/.test(e.message)?e.message:"Couldn't read that backup")}
 finally{busy(false)}
}

/* duplicate check: size + hash of the first and last 256 KB */
async function fpOf(blob){
 const n=blob.size,K=262144;
 const a=new Uint8Array(await blob.slice(0,Math.min(n,K)).arrayBuffer());
 const b=n>K?new Uint8Array(await blob.slice(Math.max(K,n-K),n).arrayBuffer()):new Uint8Array(0);
 const u=new Uint8Array(a.length+b.length);u.set(a,0);u.set(b,a.length);
 const d=new Uint8Array(await crypto.subtle.digest('SHA-256',u));
 return n+':'+[...d.slice(0,12)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function spaceFps(spaceId){
 const set=new Set();let changed=false;
 for(const it of Store.items){if(it.spaceId!==spaceId)continue;
  for(const p of (it.type==='album'?it.parts:[it])){
   if(!p.fp&&Store.mode==='local'&&p.src&&p.src.startsWith('l:')){try{const b=await idbGet('blobs',p.src.slice(2));if(b){p.fp=await fpOf(b);changed=true}}catch(e){}}
   if(p.fp)set.add(p.fp);
  }}
 if(changed)Store.saveLocal();
 return set;
}
async function handleFiles(files){
 let sp=curSpace();if(!sp){sp=await createSpace();if(!sp)return}
 const spaceId=sp.id;
 progress('Checking for duplicates…');
 let fps=[],have=new Set();
 try{fps=await Promise.all(files.map(f=>fpOf(f).catch(()=>null)));have=await spaceFps(spaceId)}catch(e){console.warn(e)}
 progressDone();
 const seen=new Set();
 let list=files.map((f,k)=>{const x=fps[k]||null;const dup=!!x&&(have.has(x)||seen.has(x));if(x)seen.add(x);return{f,fp:x,dup}});
 const nd=list.filter(x=>x.dup).length;
 if(nd){
  const all=nd===list.length;
  const r=await choose(all?(nd===1?`This is already in ${sp.name}`:`All ${nd} are already in ${sp.name}`):`${nd} of ${list.length} are already in ${sp.name}`,[{label:all?"Don't add":'Skip duplicates',v:'skip',icon:I.check},{label:'Add anyway',v:'all',icon:I.plus}]);
  if(!r)return;if(r==='skip')list=list.filter(x=>!x.dup);
  if(!list.length){toast('Nothing new to add');return}
 }
 let album=false;
 if(list.length>1){const r=await choose(`Add ${list.length} items`,[{label:'Separate posts',v:'sep',icon:I.grid},{label:'One album',v:'alb',icon:I.album}]);if(!r)return;album=r==='alb'}
 const base=Date.now();let ok=0,fail=0,local=0;const made=[];
 for(let k=0;k<list.length;k++){
  progress(list.length>1?`Adding ${k+1} of ${list.length}…`:'Adding…');
  try{
   const r=await makePart(list[k].f,list[k].fp);if(r.local)local++;
   if(album)made.push(r.p);
   else{const it=Object.assign({id:uid(),spaceId,createdAt:base+k,liked:false},r.p);if(r.local&&Store.mode==='cloud')it.localOnly=true;await Store.putItem(it)}
   ok++;
  }catch(e){console.error(e);fail++}
 }
 if(album&&made.length){
  const it=made.length===1?Object.assign({id:uid(),spaceId,createdAt:base,liked:false},made[0]):albumOf(made,{id:uid(),spaceId,createdAt:base,liked:false});
  if(local&&Store.mode==='cloud')it.localOnly=true;
  try{await Store.putItem(it)}catch(e){fail+=ok;ok=0}
 }
 progressDone();
 let msg=ok?(album&&ok>1?`Added an album of ${ok} to ${sp.name}`:`Added ${ok} to ${sp.name}`):'Nothing was added';
 if(fail)msg+=` · ${fail} failed`;
 if(local&&Store.mode==='cloud')msg+=` · ${local} too large for sync, kept on this device`;

}
function isVideo(f){return (f.type||'').startsWith('video/')||/\.(mov|mp4|m4v|webm|3gp)$/i.test(f.name||'')}
async function makePart(f,fp){
 const p={};let local=false;
 if(isVideo(f)){
  p.type='video';
  const vt=(f.type||'').toLowerCase()==='video/webm'?'video/webm':'video/mp4';
  const {thumb,meta}=await videoThumb(f);
  const m=await Store.storeBlob(f,vt);p.src=m.ref;local=!!m.local;p.size=f.size;
  if(thumb){try{const t=await Store.storeBlob(thumb,'image/jpeg');p.thumb=t.ref;p.size+=thumb.size}catch(e){}}
  for(const k of ['dur','w','h'])if(meta[k]!=null)p[k]=meta[k];
 }else{
  p.type='image';
  const r=await processImage(f);
  const m=await Store.storeBlob(r.main,r.type);p.src=m.ref;local=!!m.local;p.size=r.main.size;
  if(r.thumb){try{const t=await Store.storeBlob(r.thumb,'image/jpeg');p.thumb=t.ref;p.size+=r.thumb.size}catch(e){}}
  p.w=r.w;p.h=r.h;
 }
 if(fp)p.fp=fp;
 return{p,local};
}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url})}
function canvasJpeg(src,w,h,max,q){
 const s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
 const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q));
}
async function processImage(f){
 const url=URL.createObjectURL(f);
 try{
  const img=await loadImg(url);const w=img.naturalWidth,h=img.naturalHeight;
  const t=(f.type||'').toLowerCase();
  const keep=['image/jpeg','image/png','image/webp','image/gif'].includes(t)&&f.size<8e6&&Math.max(w,h)<=3200;
  const main=keep?f:await canvasJpeg(img,w,h,2560,.9);
  const thumb=await canvasJpeg(img,w,h,480,.78);
  if(!main)throw new Error('encode');
  return{main,type:keep?t:'image/jpeg',thumb,w,h};
 }finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
function videoThumb(f){
 return new Promise(res=>{
  const url=URL.createObjectURL(f);const v=document.createElement('video');
  let done=false,meta={};
  const fin=async draw=>{
   if(done)return;done=true;let blob=null;
   if(draw&&v.videoWidth){try{blob=await canvasJpeg(v,v.videoWidth,v.videoHeight,480,.78)}catch(e){}}
   try{v.removeAttribute('src');v.load()}catch(e){}URL.revokeObjectURL(url);res({thumb:blob,meta});
  };
  v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
  v.onloadedmetadata=()=>{meta={dur:num(v.duration),w:v.videoWidth||null,h:v.videoHeight||null};try{v.currentTime=Math.min(.05,(v.duration||1)/10)}catch(e){}};
  v.onseeked=()=>fin(true);
  v.onloadeddata=()=>setTimeout(()=>fin(true),1500);
  v.onerror=()=>fin(false);
  setTimeout(()=>fin(true),8000);
  v.src=url;v.load();
 });
}

(()=>{let t,id;const g=$('#galleryView');
 g.addEventListener('pointerdown',e=>{const tile=e.target.closest('.tile');if(!tile||S.select)return;id=tile.dataset.id;t=setTimeout(()=>{S.select=new Set([id]);renderGallery(true);if(navigator.vibrate)navigator.vibrate(10);g._sup=true},500)});
 const c=()=>clearTimeout(t);g.addEventListener('pointerup',c);g.addEventListener('pointercancel',c);g.addEventListener('pointermove',e=>{if(Math.abs(e.movementY||0)>2)c()});
 g.addEventListener('click',e=>{if(g._sup){g._sup=false;e.stopImmediatePropagation()}},true);
 g.addEventListener('contextmenu',e=>e.preventDefault());
})();
$('#vback').innerHTML=I.back;
document.querySelector('.fgear').innerHTML=I.gear;
$('#vback').onclick=()=>show('gallery');

// swipe left/right on the feed to switch spaces (not on albums, the scrub bar or the space chips)
(()=>{let sx=null,sy,st;const f=$('#feedView');
 f.addEventListener('touchstart',e=>{if(e.target.closest('.alb,.prog,.chips')){sx=null;return}const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
 f.addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2&&Date.now()-st<700){
   const sp=spacesSorted();if(sp.length<2)return;let i=sp.findIndex(s=>s.id===S.cur);i=(i+(dx<0?1:-1)+sp.length)%sp.length;setCur(sp[i].id);toast(sp[i].name);
  }},{passive:true});
})();
document.addEventListener('touchend',()=>{const f=S.view==='viewer'?viewFeed:S.view==='feed'?mainFeed:null;if(!f||f.held)return;const s=f.slideAt(f.active),p=f.cur();
 if(s&&p&&s.classList.contains('blocked')){p.muted=S.muted;p.play().catch(()=>{})}
 else if(p&&!p.paused&&p.muted&&!S.muted){p.muted=false;f.autoUnmute=Date.now()}
 f.unlockAll()},{passive:true});
// lock again whenever the app goes to the background (not while a picker, Face ID or share sheet is open)
function relockAll(){
 const had=S.unlocked.size||S.showHidden;
 S.unlocked.clear();S.showHidden=false;
 if(!had)return;
 if(sheetState.kind)closeSheet(-1);
 S.gkey='';mainFeed.key='';if(S.view==='viewer')show('gallery');render();renderGallery(true);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!isBusy())relockAll()});
window.addEventListener('pagehide',()=>{if(!isBusy())relockAll()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){mainFeed.pauseAll();viewFeed.pauseAll()}else{if(S.view==='feed')mainFeed.setVisible(true);if(S.view==='viewer')viewFeed.setVisible(true)}});

/* ---------- boot ---------- */
$('#loading .logo').innerHTML=I.layers;
mainFeed=new Feed($('#feed'));viewFeed=new Feed($('#vfeed'));
mainFeed.visible=true;
try{if(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(v=>{S.fidAvail=!!v;if(S.view==='settings')renderSettings()}).catch(()=>{})}catch(e){}
let rq=false;Store.on(()=>{if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})});
Store.init().then(()=>{
 if(Store.mode==='local')render();
 setTimeout(()=>{if(spacesSorted().length>1&&!LS.get('swipeTip',false)){toast('Tip: swipe left or right to switch spaces');LS.set('swipeTip',true)}},1500);
});
</script>
</body>
</html>
